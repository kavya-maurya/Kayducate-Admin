<!-- Hamburger Toggle Button -->
<button 
  type="button" 
  class="mobile-toggle-btn" 
  (click)="toggleSidebar()" 
  aria-label="Toggle Navigation">
  <i class="fa-solid fa-bars"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-list" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
</svg></i>
</button>

<!-- Dark Backdrop Overlay -->
<div 
  class="sidebar-overlay" 
  [class.open]="isSidebarOpen" 
  (click)="closeSidebar()">
</div>

<!-- Admin Sidebar -->
<aside class="admin-sidebar" [class.open]="isSidebarOpen">

  <div class="sidebar-brand">
    <div class="brand-logo">K</div>

    <div class="brand-text">
      <h2>Kayducate</h2>
      <span>Admin Panel</span>
    </div>

    <button 
      type="button"
      class="mobile-close-btn" 
      (click)="closeSidebar()" 
      aria-label="Close Navigation">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <nav class="sidebar-nav">

    <a 
      class="nav-item" 
      routerLink="/admin/dashboard" 
      routerLinkActive="active" 
      (click)="closeSidebar()">
      <i class="fa-solid fa-table-columns"></i>
      <span>Dashboard</span>
    </a>

    <a 
      class="nav-item" 
      routerLink="/admin/students" 
      routerLinkActive="active" 
      (click)="closeSidebar()">
      <i class="fa-solid fa-user-graduate"></i>
      <span>Students</span>
    </a>

    <a 
      class="nav-item" 
      routerLink="/admin/courses" 
      routerLinkActive="active" 
      (click)="closeSidebar()">
      <i class="fa-solid fa-book-open"></i>
      <span>Courses</span>
    </a>

    <a 
      class="nav-item" 
      routerLink="/admin/attendance" 
      routerLinkActive="active" 
      (click)="closeSidebar()">
      <i class="fa-solid fa-calendar-check"></i>
      <span>Attendance</span>
    </a>

    <a 
      class="nav-item" 
      routerLink="/admin/tasks" 
      routerLinkActive="active" 
      (click)="closeSidebar()">
      <i class="fa-solid fa-list-check"></i>
      <span>Tasks</span>
    </a>

  </nav>

  <div class="sidebar-footer">
    <button type="button" class="logout-btn">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
      <span>Logout</span>
    </button>
  </div>

</aside>
